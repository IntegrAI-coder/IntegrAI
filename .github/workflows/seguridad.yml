name: seguridad

on:
  push:
  pull_request:

jobs:
  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bloqueante: un secreto en el repo público no tiene vuelta atrás.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bloqueante: Gitleaks NO cubre PII. Detecta IPv4 PÚBLICAS (excluye privadas/localhost).
      - name: PII scan (IP pública)
        run: |
          PAT='([0-9]{1,3}\.){3}[0-9]{1,3}'
          HITS=$(git grep -nIE "$PAT" -- '*.md' '*.py' '*.sh' '*.yml' '*.yaml' '*.ts' '*.tsx' \
            | grep -vE '127\.0\.0\.1|0\.0\.0\.0|10\.[0-9]|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|255\.255\.255|localhost' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::IP pública en el repo. Usa variables de entorno o identificadores sintéticos."
            exit 1
          fi
          echo "OK: sin IPs públicas."

      # Informativo (heurístico): teléfonos. Los números de test/demo también coinciden, por eso NO bloquea.
      - name: PII scan (teléfono) — informativo
        continue-on-error: true
        run: |
          PAT='\+?56[ .-]?9[ .-]?[0-9]{4}[ .-]?[0-9]{4}'
          HITS=$(git grep -nIE "$PAT" -- '*.md' '*.py' '*.sh' '*.yml' '*.yaml' '*.ts' '*.tsx' \
            | grep -vE '0000[ .-]?000|1234[ .-]?5678|1111[ .-]?2222' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::warning::Revisa si estos teléfonos son reales; usa números sintéticos (demo)."
          else
            echo "OK: sin teléfonos sospechosos."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Bloqueante: tests offline (MODO_MOCK=1, sin credenciales AWS). pytest.ini limita a tests/.
      - name: pytest
        env:
          MODO_MOCK: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest fastapi httpx moto
          pytest -q tests   # tools/test_*.py son scripts manuales de la EC2, no tests

      # Bloqueante para vulnerabilidades conocidas en dependencias Python.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner=off

      # Informativos: el frontend tiene su lockfile en frontend/.
      - name: npm audit (frontend)
        continue-on-error: true
        run: |
          if [ -f frontend/package-lock.json ]; then
            cd frontend && npm ci && npm audit --audit-level=high
          else
            echo "sin frontend/package-lock.json; se omite"
          fi
      - name: frontend tests
        continue-on-error: true
        run: |
          if [ -f frontend/package.json ] && [ -f frontend/package-lock.json ]; then
            cd frontend && npm ci && npm test
          fi
