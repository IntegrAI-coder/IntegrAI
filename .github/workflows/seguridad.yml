name: seguridad

on:
  push:
  pull_request:

jobs:
  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt --progress-spinner=off || true; fi
          for f in requirements*.txt; do [ -e "$f" ] && echo "auditing $f" && pip-audit -r "$f" --progress-spinner=off || true; done
      - name: npm audit (condicional)
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ] || [ -f pnpm-lock.yaml ]; then
            if [ -f package-lock.json ]; then npm ci && npm audit --audit-level=high || true; fi
          else
            echo "sin lockfile JS; omitiendo npm audit"
          fi
      - name: pytest
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip install pytest boto3
          pytest -q || true
